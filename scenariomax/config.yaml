# ═══════════════════════════════════════════════════════════════════════════
# ScenarioMax Configuration File
# ═══════════════════════════════════════════════════════════════════════════
#
# Architecture:
#   - 3-stage pipeline: convert → process → format
#   - File-by-file streaming: Workers process files individually
#   - Parallelization: joblib.Parallel with configurable workers
#
# Usage Examples:
#   # Stage 1: Convert raw → unified
#   scenariomax command=convert datasets.waymo.path=/data/waymo paths.output_dir=/output
#
#   # Stage 2: Process unified scenarios
#   scenariomax command=process paths.input_dir=/output/unified paths.output_dir=/processed \
#               processing.processors=[validation,traffic_lights]
#
#   # Stage 3: Format unified → target
#   scenariomax command=format paths.input_dir=/output/unified paths.output_dir=/final \
#               formatting.target_format=pufferdrive
#
#   # Full pipeline (all 3 stages)
#   scenariomax command=pipeline datasets.waymo.path=/data/waymo paths.output_dir=/output \
#               formatting.target_format=pufferdrive processing.processors=[validation]
#
# ═══════════════════════════════════════════════════════════════════════════
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled


# ═══════════════════════════════════════════════════════════════════════════
# Command Selection
# ═══════════════════════════════════════════════════════════════════════════
command: pipeline  # Options: convert | process | format | pipeline | viz


# ═══════════════════════════════════════════════════════════════════════════
# Dataset Sources (Stage 1: Convert)
# ═══════════════════════════════════════════════════════════════════════════
# Only datasets with non-null 'path' will be processed
datasets:
  waymo:
    path: null           # Path to Waymo Open Motion Dataset
    num_files: null      # Limit number of files (null = all files)

  nuplan:
    path: null           # Path to nuPlan dataset
    split: null          # Dataset split: train | val | test
    num_files: null
    direct_from_logs: false  # Parse directly from logs (slower but more flexible)

  nuscenes:
    path: null           # Path to nuScenes dataset (WIP)
    split: "v1.0-trainval"  # Dataset split
    num_files: null

  openscenes:
    path: null           # Path to OpenScenes dataset
    metadata_dir: null   # REQUIRED: OpenScenes metadata directory
    num_files: null


# ═══════════════════════════════════════════════════════════════════════════
# Input/Output Paths
# ═══════════════════════════════════════════════════════════════════════════
paths:
  input_dir: null        # Input directory for process/format/viz commands
                         # If null, will attempt to use output_dir/unified
  output_dir: "./output" # Output directory for all commands


# ═══════════════════════════════════════════════════════════════════════════
# Stage 2: Processing
# ═══════════════════════════════════════════════════════════════════════════
# Processing runs if processors list is non-empty
# These configs apply globally to both Stage 2 (process) and Stage 3 (format with apply_processors=true)
processing:
  # List of processors to run in order
  # Available: validation, traffic_lights, polyline_interpolation, overpass_filtering
  processors: []

  # Processor-specific configurations
  validation:
    strict: false                      # Use strict validation (physics checks)
    fail_on_error: false               # Raise exception on validation failure
    validation_level: 2                # Strictness level (1=minimal, 2=standard, 3=strict, 4=paranoid)
    speed_limit_tolerance: 0.12        # Relative tolerance for speed limit checks
    position_jump_threshold: 50.0      # Max position jump between timesteps (meters)
    velocity_tolerance: 2.0            # Tolerance for velocity-position consistency (m/s)
    heading_tolerance_deg: 30.0        # Tolerance for heading-velocity alignment (degrees)

  traffic_lights: {}                   # No config options currently

  polyline_interpolation:
    max_segment_length: 2.0            # Maximum distance between polyline points (meters)

  overpass_filtering:
    xy_distance_threshold: 0.8         # Maximum XY distance to check for vertical separation (meters)
    z_difference_threshold: 4.0        # Minimum Z difference to consider as overpass (meters)


# ═══════════════════════════════════════════════════════════════════════════
# Stage 3: Formatting
# ═══════════════════════════════════════════════════════════════════════════
formatting:
  target_format: waymax               # Options: waymax | gpudrive | pufferdrive

  # Format-specific options
  waymax:
    num_shards: 1                      # Number of output .tfrecord files
    base_filename: "training"          # Filename prefix for sharded files

  gpudrive:
    pretty_print: false                # Human-readable JSON formatting

  pufferdrive:
    min_route_valid_points: 0          # Min valid trajectory points for route computation (0 = no filtering)
    route_check_timestep: 0            # Timestep where agent must be valid for route computation
    max_routes: 10                     # Number of route paths to generate per agent


# ═══════════════════════════════════════════════════════════════════════════
# Visualization Configuration
# ═══════════════════════════════════════════════════════════════════════════
visualization:
  format: "png"                        # Output format: png | mp4 | gif
  fps: 10                              # Frames per second for video output
  max_scenarios: null                  # Maximum number of scenarios to visualize (null = all)
  show_trajectory: true                # Show agent trajectory history
  scatter_map: false                   # Render road map as scattered points
  follow_ego: false                    # Center view on ego vehicle
  field_radius: null                   # Viewport radius in meters (default: 50m if follow_ego=true)


# ═══════════════════════════════════════════════════════════════════════════
# Execution Configuration
# ═══════════════════════════════════════════════════════════════════════════
execution:
  num_workers: 8                       # Number of parallel workers
  batch_size: 1                        # Files per worker batch
                                       # Higher = better DB reuse (nuPlan)
                                       # Lower = better load balancing (Waymo)
                                       # Recommended: 5-10 for Waymo, 20-50 for nuPlan


# ═══════════════════════════════════════════════════════════════════════════
# Logging Configuration
# ═══════════════════════════════════════════════════════════════════════════
logging:
  level: "INFO"                        # Options: DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_file: null                       # Log file path (null = stdout only)


# ═══════════════════════════════════════════════════════════════════════════
# Hydra Configuration (Internal)
# ═══════════════════════════════════════════════════════════════════════════
hydra:
  output_subdir: null
  run:
    dir: .
