name: Tests

on:
  push:
    branches: [main, v1.0]
  pull_request:
    branches: [main, v1.0]

jobs:
  fast-tests:
    name: Fast Validation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-uv-dev-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-dev-

      - name: Install dependencies
        run: |
          uv venv --python 3.10
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run validation tests
        run: |
          source .venv/bin/activate
          pytest tests/test_soft_validation.py tests/test_strict_validation.py -v

  waymo-tests:
    name: Waymo Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-uv-waymo-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-waymo-

      - name: Install dependencies
        run: |
          uv venv --python 3.10
          source .venv/bin/activate
          uv pip install -e ".[waymo,dev]"

      - name: Run pipeline tests
        run: |
          source .venv/bin/activate
          pytest tests/test_pipeline.py tests/test_integration.py -v
