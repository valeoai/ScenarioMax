name: Lint

on:
  push:
    branches: [main, v1.0]
  pull_request:
    branches: [main, v1.0]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Run ruff check
        run: ruff check scenariomax/

      - name: Run ruff format check
        run: ruff format --check scenariomax/
